[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor"
version = "1.0.0"
description = "Distributed task queue with leases, retries, backoff, dead-letter queue and a live dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vinodhini" }]
dependencies = []

[project.scripts]
conveyor = "conveyor.__main__:main"

[tool.setuptools]
packages = ["conveyor"]

[tool.setuptools.package-data]
conveyor = ["static/*.html"]
